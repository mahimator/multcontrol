[workspace]
resolver = "2"
members = ["crates/mc-core", "crates/mc-agent"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
toml = "0.8"

[profile.release]
# Latency matters more than the last few hundred kilobytes on the input path.
opt-level = 3
lto = true
codegen-units = 1
strip = true
